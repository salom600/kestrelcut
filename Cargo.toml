[package]
name = "kestrelcut"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "KestrelCut — fast, stable, feather-light cross-platform video editor (FFmpeg bundled)"
license = "MIT"
repository = "https://github.com/salom600/kestrelcut"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
cpal = { version = "0.15", optional = true }

[features]
default = ["audio"]
audio = ["dep:cpal"]

[profile.release]
opt-level = 2
strip = true
